<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>极简倒计时</title>
    <style>
        /* 1. 基础样式：黑底白字，强制占满屏幕 */
        * { box-sizing: border-box; }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #000; color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            overflow: hidden;
        }

        /* 2. 计时器居中：使用 vw 单位确保自适应 */
        #container {
            text-align: center;
            width: 100%;
        }

        #timer {
            font-size: 32vw; /* 超大字体 */
            font-weight: 200;
            font-variant-numeric: tabular-nums; /* 防止数字跳动 */
            line-height: 1;
            margin: 0;
            transition: color 0.5s ease;
        }

        #status {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* 倒计时结束时的视觉效果 */
        .finished #timer { color: #ff3b30; font-weight: 500; }
    </style>
</head>
<body onclick="togglePause()">

    <div id="container">
        <div id="timer">05:00</div>
        <div id="status">正在计时 (点击暂停)</div>
    </div>

    <script>
        let timeLeft = 300;
        let isPaused = false;
        let wakeLock = null;

        // 启动逻辑
        window.onload = () => {
            requestWakeLock(); // 请求防止息屏
            startCountdown();
        };

        function updateDisplay() {
            const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const s = (timeLeft % 60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `${m}:${s}`;
        }

        function startCountdown() {
            const interval = setInterval(() => {
                if (!isPaused) {
                    timeLeft--;
                    updateDisplay();
                    if (timeLeft <= 0) {
                        clearInterval(interval);
                        document.body.classList.add('finished');
                        document.getElementById('status').innerText = "时间到";
                        releaseWakeLock(); // 结束后允许息屏
                    }
                }
            }, 1000);
        }

        function togglePause() {
            isPaused = !isPaused;
            document.getElementById('status').innerText = isPaused ? "已暂停 (点击继续)" : "正在计时 (点击暂停)";
        }

        // ---核心：防止息屏代码---
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('防止息屏已激活');
                }
            } catch (err) {
                console.log('无法激活防止息屏:', err.message);
            }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release();
                wakeLock = null;
            }
        }

        // 页面切换回来时重新激活锁（防止从后台切回失效）
        document.addEventListener('visibilitychange', () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                requestWakeLock();
            }
        });
    </script>
</body>
</html>
