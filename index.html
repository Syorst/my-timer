<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- PWA 设置 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="5分倒计时">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/180/000000/FFFFFF?text=5Min">

    <title>5分倒计时</title>
    <style>
        :root { --bg-color: #000; --text-color: #fff; --accent: #ff3b30; }
        body { 
            margin: 0; background: var(--bg-color); color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden; user-select: none;
        }
        /* 时间显示：超大字体，居中 */
        #timer { 
            font-size: 28vw; 
            font-variant-numeric: tabular-nums; 
            font-weight: 100;
            letter-spacing: -2px;
        }
        /* 交互提示 */
        #hint {
            position: absolute; bottom: 10%; font-size: 14px; color: #666;
        }
        /* 正在计时的视觉反馈（呼吸灯效果） */
        .running #timer { color: var(--accent); transition: 0.3s; }
    </style>
</head>
<body onclick="toggleTimer()">

    <div id="timer">05:00</div>
    <div id="hint">点击屏幕：暂停/恢复</div>

    <script>
        let countdown;
        let timeLeft = 300; // 默认 5 分钟
        let isPaused = false;

        // 页面一加载就执行
        window.onload = () => {
            startTimer();
        };

        function updateDisplay(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `${m}:${s}`;
        }

        function startTimer() {
            if (countdown) clearInterval(countdown);
            document.body.classList.add('running');
            
            countdown = setInterval(() => {
                if (!isPaused) {
                    timeLeft--;
                    updateDisplay(timeLeft);
                    if (timeLeft <= 0) {
                        clearInterval(countdown);
                        document.body.classList.remove('running');
                        alert("时间到！");
                    }
                }
            }, 1000);
        }

        // 简单的暂停/恢复逻辑
        function toggleTimer() {
            isPaused = !isPaused;
            document.getElementById('hint').innerText = isPaused ? "已暂停，点击继续" : "点击屏幕：暂停/恢复";
            if (isPaused) {
                document.body.classList.remove('running');
            } else {
                document.body.classList.add('running');
            }
        }
    </script>
</body>
</html>
